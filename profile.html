<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - QuickDesk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <span>🎫</span> QuickDesk
            </a>
            <ul class="nav-menu" id="nav-user-area">
                <!-- Dynamically populated -->
            </ul>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <h1 style="font-size: 1.8rem; margin-bottom: 20px;">User Profile &amp; Settings</h1>

        <div class="profile-grid">
            
            <!-- Left Column: User Summary Card -->
            <div>
                <div class="card" style="text-align: center;">
                    <div class="avatar-large" id="profile-avatar-letter">U</div>
                    <h3 id="profile-name-display" style="margin-bottom: 4px;">User Name</h3>
                    <p id="profile-email-display" style="color: var(--secondary-color); font-size: 0.9rem; margin-bottom: 12px;">user@example.com</p>
                    <div>
                        <span id="profile-role-badge" class="user-badge badge-user">User</span>
                    </div>
                    <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">
                    <div style="font-size: 0.88rem; color: #555; text-align: left;">
                        <p style="margin-bottom: 8px;"><strong>Status:</strong> Active Account</p>
                        <p><strong>Storage:</strong> LocalStorage Demo Mode</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Edit Forms -->
            <div>
                <!-- Personal Info Form -->
                <div class="card">
                    <h3 class="card-title">Personal Information</h3>
                    <form id="profile-info-form">
                        <div class="form-group">
                            <label class="form-label" for="profile-fullname">Full Name *</label>
                            <input type="text" id="profile-fullname" class="form-control" required>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div class="form-group">
                                <label class="form-label" for="profile-email">Email Address (Read-only)</label>
                                <input type="email" id="profile-email" class="form-control" disabled style="background-color: #e9ecef; cursor: not-allowed;">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="profile-phone">Phone Number</label>
                                <input type="text" id="profile-phone" class="form-control" placeholder="+1 555-0100">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="profile-created">Member Since</label>
                            <input type="text" id="profile-created" class="form-control" disabled style="background-color: #e9ecef; cursor: not-allowed;">
                        </div>

                        <div class="form-group">
                            <label class="form-label" for="profile-bio">Bio / Description</label>
                            <textarea id="profile-bio" class="form-control" rows="3" placeholder="Tell us about your role or department..."></textarea>
                        </div>

                        <button type="submit" class="btn btn-primary">
                            Save Profile Changes
                        </button>
                    </form>
                </div>

                <!-- Password Change Form -->
                <div class="card">
                    <h3 class="card-title">Security &amp; Change Password</h3>
                    <form id="password-change-form">
                        <div class="form-group">
                            <label class="form-label" for="current-password">Current Password *</label>
                            <input type="password" id="current-password" class="form-control" placeholder="Enter current password" required>
                        </div>

                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
                            <div class="form-group">
                                <label class="form-label" for="new-password">New Password *</label>
                                <input type="password" id="new-password" class="form-control" placeholder="At least 6 characters" required>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="confirm-new-password">Confirm New Password *</label>
                                <input type="password" id="confirm-new-password" class="form-control" placeholder="Re-type new password" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-secondary">
                            Update Password
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>QuickDesk &copy; 2026 &bull; Frontend-Only Web Application</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
