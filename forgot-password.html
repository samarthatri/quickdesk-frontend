<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - QuickDesk</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand">
                <span>🎫</span> QuickDesk
            </a>
            <ul class="nav-menu" id="nav-user-area">
                <!-- Dynamically populated -->
            </ul>
        </div>
    </nav>

    <!-- Main Auth Container -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <h2>Reset Password</h2>
                <p>Recover access to your account using your email</p>
            </div>

            <!-- Alert Notification -->
            <div id="reset-alert" class="alert"></div>

            <!-- Step 1: Identify Email Form -->
            <form id="find-account-form" novalidate>
                <div class="form-group">
                    <label class="form-label" for="reset-email">Registered Email Address</label>
                    <input type="email" id="reset-email" class="form-control" placeholder="name@example.com" required>
                    <div id="reset-email-error" class="error-text"></div>
                    <small class="form-help">Enter the email you used when creating your account.</small>
                </div>

                <button type="submit" class="btn btn-primary btn-block" style="padding: 10px; margin-top: 10px;">
                    Verify Email &rarr;
                </button>
            </form>

            <!-- Step 2: Set New Password (Hidden initially) -->
            <form id="new-password-form" style="display: none;" novalidate>
                <div style="background-color: #e8f4fd; padding: 10px; border-radius: 6px; margin-bottom: 16px; font-size: 0.88rem;">
                    Account found for: <strong id="verified-email-badge"></strong>
                </div>

                <div class="form-group">
                    <label class="form-label" for="new-pass">New Password</label>
                    <input type="password" id="new-pass" class="form-control" placeholder="At least 6 characters" required>
                    <div id="new-pass-error" class="error-text"></div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-new-pass">Confirm New Password</label>
                    <input type="password" id="confirm-new-pass" class="form-control" placeholder="Re-type new password" required>
                    <div id="confirm-new-pass-error" class="error-text"></div>
                </div>

                <button type="submit" class="btn btn-success btn-block" style="padding: 10px; margin-top: 10px;">
                    Save New Password
                </button>
            </form>

            <div class="auth-links">
                Remember your password? <a href="login.html">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>QuickDesk &copy; 2026 &bull; Frontend-Only Web Application</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="js/data.js"></script>
    <script src="js/auth.js"></script>
    <script>
        redirectIfLoggedIn();

        const findForm = document.getElementById('find-account-form');
        const newPassForm = document.getElementById('new-password-form');
        const emailInput = document.getElementById('reset-email');
        const emailError = document.getElementById('reset-email-error');
        const alertBox = document.getElementById('reset-alert');

        const newPassInput = document.getElementById('new-pass');
        const confirmPassInput = document.getElementById('confirm-new-pass');
        const newPassError = document.getElementById('new-pass-error');
        const confirmPassError = document.getElementById('confirm-new-pass-error');
        const verifiedEmailBadge = document.getElementById('verified-email-badge');

        let matchedUser = null;

        // Step 1: Verify Email
        findForm.addEventListener('submit', function(e) {
            e.preventDefault();
            clearError(emailInput, emailError);
            alertBox.style.display = 'none';

            const email = emailInput.value.trim().toLowerCase();

            if (!email) {
                showError(emailInput, emailError, 'Email address is required.');
                return;
            }
            if (!isValidEmail(email)) {
                showError(emailInput, emailError, 'Please enter a valid email format.');
                return;
            }

            const users = getUsers();
            matchedUser = users.find(u => u.email.toLowerCase() === email);

            if (!matchedUser) {
                alertBox.className = 'alert alert-danger';
                alertBox.textContent = 'No account found with this email address.';
                alertBox.style.display = 'block';
                return;
            }

            // Account found: transition to Step 2
            findForm.style.display = 'none';
            verifiedEmailBadge.textContent = matchedUser.email;
            newPassForm.style.display = 'block';

            alertBox.className = 'alert alert-info';
            alertBox.textContent = 'Identity verified! Please set your new password below.';
            alertBox.style.display = 'block';
        });

        // Step 2: Save New Password
        newPassForm.addEventListener('submit', function(e) {
            e.preventDefault();
            clearError(newPassInput, newPassError);
            clearError(confirmPassInput, confirmPassError);

            const newPass = newPassInput.value;
            const confirmPass = confirmPassInput.value;
            let isValid = true;

            if (!isValidPassword(newPass)) {
                showError(newPassInput, newPassError, 'Password must be at least 6 characters long.');
                isValid = false;
            }

            if (!confirmPass) {
                showError(confirmPassInput, confirmPassError, 'Please confirm your new password.');
                isValid = false;
            } else if (newPass !== confirmPass) {
                showError(confirmPassInput, confirmPassError, 'Passwords do not match.');
                isValid = false;
            }

            if (!isValid) return;

            // Update user in localStorage
            const users = getUsers();
            const userIndex = users.findIndex(u => u.id === matchedUser.id);
            if (userIndex !== -1) {
                users[userIndex].password = newPass;
                saveUsers(users);
            }

            alertBox.className = 'alert alert-success';
            alertBox.textContent = 'Password reset successful! Redirecting to login...';
            alertBox.style.display = 'block';

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>
</html>
